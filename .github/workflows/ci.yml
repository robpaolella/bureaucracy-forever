name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate`, so the generated client exists before typecheck.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # No database or Discord secrets here: the build must not connect to anything.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
